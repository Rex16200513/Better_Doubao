<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Better Doubao - Settings</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      min-width: 600px;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #ffffff;
    }
    .header {
      margin-bottom: 24px;
    }
    .title {
      font-size: 20px;
      font-weight: 600;
      color: #1f2937;
      margin-bottom: 4px;
    }
    .desc {
      font-size: 14px;
      color: #6b7280;
    }
    .section {
      padding: 16px;
      background: #f9fafb;
      border-radius: 8px;
      margin-bottom: 16px;
    }
    .section-title {
      font-size: 14px;
      font-weight: 500;
      color: #1f2937;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">Better Doubao - Settings</div>
    <div class="desc">自定义您的豆包浏览体验</div>
  </div>
  <div class="section">
    <div class="section-title">文件夹功能</div>
    <p style="font-size: 13px; color: #6b7280;">
      在豆包侧边栏创建文件夹，将聊天记录拖入进行分类管理。
    </p>
  </div>
</body>
</html>
