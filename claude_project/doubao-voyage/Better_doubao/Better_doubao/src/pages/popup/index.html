<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Better Doubao</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 300px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #ffffff;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e5e7eb;
    }
    .logo {
      width: 32px;
      height: 32px;
      border-radius: 8px;
    }
    .title {
      font-size: 16px;
      font-weight: 600;
      color: #1f2937;
    }
    .version {
      font-size: 11px;
      color: #9ca3af;
    }
    .feature {
      padding: 12px;
      background: #f9fafb;
      border-radius: 8px;
      margin-bottom: 8px;
    }
    .feature-title {
      font-size: 14px;
      font-weight: 500;
      color: #1f2937;
      margin-bottom: 4px;
    }
    .feature-desc {
      font-size: 12px;
      color: #6b7280;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="https://lf-flow-web-cdn.doubao.com/obj/flow-doubao/samantha/logo-icon-white-bg.png" alt="logo" class="logo">
    <div>
      <div class="title">Better Doubao</div>
      <div class="version">v1.0.0</div>
    </div>
  </div>
  <div class="feature">
    <div class="feature-title">📁 文件夹管理</div>
    <div class="feature-desc">将聊天记录归类到自定义文件夹，支持拖拽整理，颜色标记</div>
  </div>
  <div class="feature">
    <div class="feature-title">🎯 指示标签</div>
    <div class="feature-desc">在已归类的对话上显示颜色指示点，快速识别分类</div>
  </div>
</body>
</html>
