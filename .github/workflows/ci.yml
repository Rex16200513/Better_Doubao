name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, Test & Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run regression and unit tests
        run: npm test

      - name: Build Chrome & Edge and verify artifacts
        run: npm run build

      - name: Upload Chrome artifact
        uses: actions/upload-artifact@v4
        with:
          name: better-doubao-chrome-node${{ matrix.node-version }}
          path: chrome/dist/
          retention-days: 14

      - name: Upload Edge artifact
        uses: actions/upload-artifact@v4
        with:
          name: better-doubao-edge-node${{ matrix.node-version }}
          path: edge/dist/
          retention-days: 14
