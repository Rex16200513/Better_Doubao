<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Better Doubao</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 300px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #ffffff;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e5e7eb;
    }
    .logo {
      width: 32px;
      height: 32px;
      border-radius: 8px;
    }
    .title {
      font-size: 16px;
      font-weight: 600;
      color: #1f2937;
    }
    .version {
      font-size: 11px;
      color: #9ca3af;
    }
    .feature {
      padding: 12px;
      background: #f9fafb;
      border-radius: 8px;
      margin-bottom: 8px;
    }
    .feature-title {
      font-size: 14px;
      font-weight: 500;
      color: #1f2937;
      margin-bottom: 4px;
    }
    .feature-desc {
      font-size: 12px;
      color: #6b7280;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="/icons/icon48.png" alt="Better Doubao logo" class="logo">
    <div>
      <div class="title">Better Doubao</div>
      <div class="version">v2.2.0</div>
    </div>
  </div>
  <div class="feature">
    <div class="feature-title">🎨 可视化布局与 6 套主题定制</div>
    <div class="feature-desc">点击工具栏 ⚙ 打开豆包原型图弹窗，直点开关各区域元素、配置悬浮快捷胶囊并切换全局配色主题</div>
  </div>
  <div class="feature">
    <div class="feature-title">🗂️ 分类文件夹与极简色彩圆点</div>
    <div class="feature-desc">用极简圆点替换原生对话图标，点击圆点一键归类，支持彩色文件夹拖拽整理</div>
  </div>
  <div class="feature">
    <div class="feature-title">🧰 工具栏、高亮与语料板</div>
    <div class="feature-desc">统一毛玻璃面板整合语料板、对话搜索、六色高亮收藏目录与 JSON 数据备份恢复</div>
  </div>
  <div class="feature">
    <div class="feature-title">👍 原生点赞标星与多格式导出</div>
    <div class="feature-desc">点豆包原生「赞」同步高亮左侧定位点，支持清爽导出 PDF / TXT / Markdown 及 LaTeX 公式</div>
  </div>
</body>
</html>
