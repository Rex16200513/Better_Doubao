<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Better Doubao</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 300px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #ffffff;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e5e7eb;
    }
    .logo {
      width: 32px;
      height: 32px;
      border-radius: 8px;
    }
    .title {
      font-size: 16px;
      font-weight: 600;
      color: #1f2937;
    }
    .version {
      font-size: 11px;
      color: #9ca3af;
    }
    .feature {
      padding: 12px;
      background: #f9fafb;
      border-radius: 8px;
      margin-bottom: 8px;
    }
    .feature-title {
      font-size: 14px;
      font-weight: 500;
      color: #1f2937;
      margin-bottom: 4px;
    }
    .feature-desc {
      font-size: 12px;
      color: #6b7280;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="/icons/icon48.png" alt="Better Doubao logo" class="logo">
    <div>
      <div class="title">Better Doubao</div>
      <div class="version">v2.1.0</div>
    </div>
  </div>
  <div class="feature">
    <div class="feature-title">🧰 随手工具</div>
    <div class="feature-desc">点击悬浮按钮展开语料板、对话搜索、高亮与收藏目录及 JSON 数据备份恢复</div>
  </div>
  <div class="feature">
    <div class="feature-title">🖍️ 文字高亮与语料板</div>
    <div class="feature-desc">划词一键六色高亮并持久保留，支持收藏文本片段快速插入输入框</div>
  </div>
  <div class="feature">
    <div class="feature-title">🧭 快速定位与多格式导出</div>
    <div class="feature-desc">右侧消息定位点兼容虚拟列表，支持导出 PDF / TXT / Markdown 及 LaTeX 公式</div>
  </div>
  <div class="feature">
    <div class="feature-title">📁 侧边栏精简与旧文件夹（过渡）</div>
    <div class="feature-desc">顶部入口收纳为图标栏，保留旧文件夹与颜色标签，原有数据安全不丢失</div>
  </div>
</body>
</html>
