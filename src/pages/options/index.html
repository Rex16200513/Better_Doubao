<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Better Doubao - Settings</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      min-width: 600px;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #ffffff;
    }
    .header {
      margin-bottom: 24px;
    }
    .title {
      font-size: 20px;
      font-weight: 600;
      color: #1f2937;
      margin-bottom: 4px;
    }
    .desc {
      font-size: 14px;
      color: #6b7280;
    }
    .section {
      padding: 16px;
      background: #f9fafb;
      border-radius: 8px;
      margin-bottom: 16px;
    }
    .section-title {
      font-size: 14px;
      font-weight: 500;
      color: #1f2937;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">Better Doubao v2.0.0</div>
    <div class="desc">自定义与管理您的豆包网页版增强体验</div>
  </div>
  <div class="section">
    <div class="section-title">随手工具（语料板 / 搜索 / 高亮目录 / 备份）</div>
    <p style="font-size: 13px; color: #6b7280; line-height: 1.6;">
      在豆包对话页点击悬浮按钮即可打开统一工具菜单，支持按关键词定位已加载消息、按颜色回看高亮与收藏，以及导入导出 JSON 备份文件（恢复前会自动保存一份回退副本）。
    </p>
  </div>
  <div class="section">
    <div class="section-title">数据与隐私说明</div>
    <p style="font-size: 13px; color: #6b7280; line-height: 1.6;">
      所有文件夹、语料、高亮和收藏数据仅保存在浏览器扩展本地存储中，不向任何第三方服务器上传。
    </p>
  </div>
</body>
</html>
